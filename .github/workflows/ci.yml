name: CI Pipeline — PinIt ScamCheck AI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality & Linting
  # ---------------------------------------------------------------------------
  lint:
    name: Code Quality & Linting (oxlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run oxlint
        run: npx oxlint

  # ---------------------------------------------------------------------------
  # 2. Frontend Build Verification
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend SPA Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Vite Production Bundle
        run: npm run build

  # ---------------------------------------------------------------------------
  # 3. Backend Test Suite & Type Verification
  # ---------------------------------------------------------------------------
  backend:
    name: Backend Test Suite & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Verify TypeScript Compilation
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Vitest Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_32chars_minimum
          ADMIN_API_KEY: test_admin_key_for_ci_pipeline
        run: npm test

  # ---------------------------------------------------------------------------
  # 4. Python AI Engine Test Suite
  # ---------------------------------------------------------------------------
  ai-engine:
    name: Python AI Engine Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai_engine/requirements.txt

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: pip install -r ai_engine/requirements.txt pytest

      - name: Run Pytest
        run: python -m pytest ai_engine/tests
