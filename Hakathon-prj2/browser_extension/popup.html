<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScamCheck AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 340px; background: #0f172a; color: #f8fafc; padding: 14px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #38bdf8; }
    .badge { font-size: 10px; background: #0284c7; color: white; padding: 2px 6px; rounded: 4px; border-radius: 4px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tab { flex: 1; padding: 6px; background: #1e293b; border: none; color: #94a3b8; font-size: 12px; border-radius: 6px; cursor: pointer; text-align: center; }
    .tab.active { background: #0284c7; color: white; font-weight: 600; }
    textarea, input { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 12px; margin-bottom: 10px; resize: none; }
    button.scan-btn { width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    button.scan-btn:hover { background: #1d4ed8; }
    .result { margin-top: 12px; padding: 10px; border-radius: 8px; display: none; }
    .result.safe { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; }
    .result.high { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; }
    .result.medium { background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; }
    .res-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .res-score { font-size: 18px; font-weight: 800; font-family: monospace; }
    .res-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .res-summary { font-size: 11px; color: #cbd5e1; line-height: 1.4; margin-bottom: 6px; }
    .res-rec { font-size: 10px; color: #94a3b8; line-height: 1.3; }
    .spinner { display: none; text-align: center; padding: 12px; font-size: 12px; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="logo.png" alt="PinIt" style="height: 22px; width: auto; object-fit: contain; border-radius: 4px; vertical-align: middle;" />
      <span>ScamCheck AI</span>
      <span class="badge">v1.0</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-url">Current / Check URL</button>
    <button class="tab" id="tab-msg">Message</button>
  </div>

  <div id="url-container">
    <input type="text" id="url-input" placeholder="https://example.com or paste link..." />
  </div>

  <div id="msg-container" style="display: none;">
    <textarea id="msg-input" rows="3" placeholder="Paste SMS, Telegram, or email text..."></textarea>
  </div>

  <button class="scan-btn" id="btn-scan">Analyze with AI</button>

  <div class="spinner" id="loading-spinner">Analyzing threat indicators...</div>

  <div class="result" id="result-box">
    <div class="res-header">
      <span class="res-cat" id="res-category">PHISHING</span>
      <span class="res-score" id="res-score">85/100</span>
    </div>
    <div class="res-summary" id="res-summary"></div>
    <div class="res-rec" id="res-recommendation"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
