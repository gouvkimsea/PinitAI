version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pinit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinit_security}
      POSTGRES_USER: ${POSTGRES_USER:-pinit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinit_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pinit-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinit} -d ${POSTGRES_DB:-pinit_security}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Queue
  redis:
    image: redis:7-alpine
    container_name: pinit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    volumes:
      - redis_data:/data
    networks:
      - pinit-backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. ClamAV Antivirus Daemon
  clamav:
    image: clamav/clamav:1.4
    container_name: pinit-clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - pinit-backend-net
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "127.0.0.1:3310"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 4. PinIt Security API Gateway
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinit-security-api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pinit}:${POSTGRES_PASSWORD:-pinit_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-pinit_security}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_replace_in_production_min32chars}
      API_KEY_SECRET: ${API_KEY_SECRET:-super_secret_api_key_salt_replace_in_prod}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      SCAN_FILE_MAX_SIZE_MB: 25
      SCAN_WORKER_CONCURRENCY: 5
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - pinit-backend-net
      - pinit-frontend-net

  # 5. Dedicated Asynchronous Scan Worker (Horizontal Queue Scaling)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinit-security-worker
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pinit}:${POSTGRES_PASSWORD:-pinit_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-pinit_security}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SCAN_WORKER_CONCURRENCY: 10
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - pinit-backend-net

networks:
  pinit-backend-net:
    driver: bridge
    internal: false
  pinit-frontend-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clamav_db:
