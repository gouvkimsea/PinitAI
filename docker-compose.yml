version: '3.8'

services:
  # 1. React Frontend SPA & Reverse Proxy Ingress Gateway
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scamcheck-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - scamcheck-net

  # 2. Node.js Express API (Auth, History, Reports, Queue)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamcheck-backend-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: "postgresql://${POSTGRES_USER:-scamcheck}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in .env}@postgres:5432/${POSTGRES_DB:-scamcheck_db}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Error: REDIS_PASSWORD must be configured in .env}@redis:6379"
      AI_ENGINE_URL: "http://ai-engine:8000"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Error: ADMIN_API_KEY must be configured in .env}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET must be configured in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - scamcheck-net

  # 3. Python FastAPI AI Engine (Scam & QR & File Analysis)
  # Internal service only: port 8000 is NOT mapped to host for defense-in-depth
  ai-engine:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    container_name: scamcheck-ai-engine
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Error: ADMIN_API_KEY must be configured in .env}
    networks:
      - scamcheck-net

  # 4. ClamAV Antivirus Daemon (Pinned to stable release)
  clamav:
    image: clamav/clamav:1.4
    container_name: scamcheck-clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - scamcheck-net
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "127.0.0.1:3310"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 5. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: scamcheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scamcheck_db}
      POSTGRES_USER: ${POSTGRES_USER:-scamcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scamcheck-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scamcheck} -d ${POSTGRES_DB:-scamcheck_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Redis Job Broker
  redis:
    image: redis:7-alpine
    container_name: scamcheck-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Error: REDIS_PASSWORD must be configured in .env}
    volumes:
      - redis_data:/data
    networks:
      - scamcheck-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Error: REDIS_PASSWORD must be configured in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  scamcheck-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clamav_db:
